<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#15181D" />
  <title>TrackerTFT · TFT lobby scout, comp tracker and head-to-head stats</title>
  <meta name="description" content="Scout your Teamfight Tactics lobby: see which meta comp each player is on, which carries are contested, which comps fit your items, and your head-to-head record against every opponent." />
  <link rel="canonical" href="https://trackertft.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TrackerTFT" />
  <meta property="og:url" content="https://trackertft.com/" />
  <meta property="og:title" content="TrackerTFT · TFT lobby scout and comp tracker" />
  <meta property="og:description" content="See which meta comp each player in your TFT lobby is on, which carries are contested, and your head-to-head record against them." />
  <meta property="og:image" content="https://trackertft.com/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="TrackerTFT: scout your TFT lobby" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "TrackerTFT",
    "url": "https://trackertft.com/",
    "description": "Teamfight Tactics lobby scout: link each player to the meta comp they are playing, spot contested carries, find comps that fit your items and see your head-to-head record against every opponent.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.metatft.com">
  <link rel="preconnect" href="https://raw.communitydragon.org">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />

  <link rel="modulepreload" href="Scripts/mainScreen/domContentLoad.js">
  <link rel="modulepreload" href="Scripts/mainScreen.js">
  <link rel="modulepreload" href="Scripts/performanceOptimizer.js">
  <link rel="modulepreload" href="Scripts/lazyLoader.js">
</head>

<body>
  <h1 class="visually-hidden">TrackerTFT: Teamfight Tactics lobby scout and comp tracker</h1>
  <noscript><p class="noscript">TrackerTFT scouts your Teamfight Tactics lobby: look up a live game, link each player to the meta comp they are playing, spot contested carries and see your head-to-head record against every opponent. It needs JavaScript to run.</p></noscript>
  <header class="app-header">
    <a class="brand" href="/" aria-label="TrackerTFT home"><img src="/favicon.svg" alt="" width="24" height="24"><span>Tracker<b>TFT</b></span></a>
    <nav id="view-tabs" class="view-tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-tracker" data-view="tracker" aria-controls="tracker-view" aria-selected="true">Lobby</button>
      <button type="button" role="tab" id="tab-transitions" data-view="summary" aria-controls="transitions-view" aria-selected="false" tabindex="-1">Set Summary</button>
    </nav>

    <div class="player-search" role="search" hidden>
      <select id="serverSelector" aria-label="Region"></select>
      <input id="playerNameInput" type="text" placeholder="Search a player to load their live game" aria-label="Riot ID" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
      <button id="searchPlayerButton" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
      <div id="messageContainer" class="search-message" role="status" style="display: none;"></div>
    </div>

    <div class="header-right">
      <div class="seg mode-switch" role="group" aria-label="Game mode">
        <button type="button" data-mode="solo" aria-pressed="true">Solo</button>
        <button type="button" data-mode="double" aria-pressed="false">Double<span class="long"> Up</span></button>
      </div>
      <input type="checkbox" id="color_mode" hidden>
      <label class="set-selector" hidden><select id="setSelector" aria-label="Set"></select></label>
      <span class="patch-label" id="patchLabel"></span>
      <button type="button" id="copyShareUrlButton" class="btn-primary">Share</button>
      <div id="accountSlot" class="acct-slot"></div>
    </div>
  </header>

  <main id="tracker-view" class="lobby" role="tabpanel" aria-labelledby="tab-tracker">
    <section class="sheet" aria-label="Compositions by player">
      <div class="sheet-tools">
        <div id="comp-search-div" class="comp-filter">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <div id="comp-tags-container" class="tags-container"></div>
          <input id="comp-search-input" type="text" placeholder="Filter by champion, item or style" aria-label="Filter compositions" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <ul id="comp-suggestions" class="suggestions" style="display:none;"></ul>
        </div>
        <div class="view-filter" role="group" aria-label="Show">
          <button type="button" class="pill" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="pill" data-filter="open" aria-pressed="false"><span class="star" aria-hidden="true">★</span>Uncontested</button>
          <button type="button" class="pill" data-filter="linked" aria-pressed="false"><span class="sw linked"></span>Linked</button>
        </div>
        <span class="sheet-count" id="sheetCount"></span>
        <button type="button" id="resetButton" class="icon-btn" title="Reset lobby" aria-label="Reset lobby">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>

      <div class="matrix" id="matrix">
        <div class="matrix-head">
          <div class="mh-comp">
            <div class="source-switch" id="sourceSwitch" hidden></div>
            <a class="source-credit" id="sourceCredit" target="_blank" rel="noopener" hidden></a>
            <span class="source-note" id="sourceNote" hidden></span>
            <button type="button" id="copyPlayerNamesButton" class="copy-names-btn" title="Copy player names" aria-label="Copy player names">⧉</button>
          </div>
          <div id="players"></div>
        </div>
        <div id="compos"></div>
      </div>
    </section>

    <aside class="side">
      <section class="card picker" id="itemPicker" aria-label="Items"></section>
      <section class="card contested" id="contestedCard" aria-label="Contested carries" hidden>
        <h3>Contested carries <small>players on them</small></h3>
        <div class="bars" id="contestedBars"></div>
        <div class="legend"><span><i class="dot"></i>Confirmed</span><span><i class="dot ring"></i>Possible</span></div>
      </section>
      <section class="card potential" id="playerCard" aria-label="Potential comps" hidden></section>
    </aside>
  </main>

  <section id="transitions-view" role="tabpanel" aria-labelledby="tab-transitions" hidden></section>
  <div class="stat-card" id="statCard" role="tooltip" hidden></div>

  <script type="module" src="Scripts/mainScreen/domContentLoad.js"></script>
  <script type="module" src="Scripts/mainScreen.js"></script>
  <script type="module" src="Scripts/account/header.js"></script>
</body>

</html>
